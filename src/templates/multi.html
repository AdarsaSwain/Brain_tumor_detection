<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Modal Analysis - NeuroScan AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>
    <nav class="topnav">
        <div class="topnav_left">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
            <a href="/">NeuroScan AI</a>
        </div>
        <div class="topnav_right">
            <a href="/" style="text-decoration: none; color: var(--primary); font-weight: 600;"><i class="fa-solid fa-house"></i> Home</a>
        </div>
    </nav>

    <main class="container">
        <div class="card upload-zone">
            <h2 style="margin-bottom: 1.5rem;">Multi-Modal Classification</h2>
            <p style="margin-bottom: 2rem;">Identify the specific type of brain tumor (Glioma, Meningioma, Pituitary).</p>

            <form id="uploadImage" method="post" enctype="multipart/form-data">
                <input type="file" name="image" id="image-input" accept="image/*" required>
                
                <div class="image-preview-wrapper">
                    <img id="image-preview" alt="Preview" style="display: none;">
                    <div id="preview-placeholder" style="color: var(--text-muted);">
                        <i class="fa-solid fa-layer-group" style="font-size: 3rem; display: block; margin-bottom: 1rem;"></i>
                        Select an image
                    </div>
                </div>

                <button type="submit" class="submit-btn">Analyze Tumor Type</button>
            </form>

            <h2 id="result" class="result-text" style="color: var(--secondary);"></h2>
        </div>
    </main>

    <script>
        $(function () {
            const $preview = $('#image-preview');
            const $placeholder = $('#preview-placeholder');
            const $result = $('#result');

            $('#image-input').on('change', function(e) {
                $result.text("");
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        $preview.attr('src', e.target.result).show();
                        $placeholder.hide();
                    }
                    reader.readAsDataURL(file);
                }
            });

            $('#uploadImage').on('submit', function (e) {
                e.preventDefault();
                const formData = new FormData(this);
                
                $result.text("Classifying...").css('color', 'var(--text-muted)');
                
                $.ajax({
                    type: 'POST',
                    url: '/multi.html',
                    data: formData,
                    cache: false,
                    contentType: false,
                    processData: false,
                    success: function (data) {
                        $result.text("Result: " + data.result).css('color', 'var(--primary)');
                    },
                    error: function() {
                        $result.text("Error occurred during classification.").css('color', '#ef4444');
                    }
                });
            });
        });
    </script>
</body>
</html>
