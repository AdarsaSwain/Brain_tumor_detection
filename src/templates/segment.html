<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumor Segmentation - NeuroScan AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>
    <nav class="topnav">
        <div class="topnav_left">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
            <a href="/">NeuroScan AI</a>
        </div>
        <div class="topnav_right">
            <a href="/" style="text-decoration: none; color: var(--primary); font-weight: 600;"><i class="fa-solid fa-house"></i> Home</a>
        </div>
    </nav>

    <main class="container">
        <div class="card">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Brain Tumor Segmentation</h2>
            <p style="margin-bottom: 2rem; text-align: center;">Precise localization and area calculation of the tumor region.</p>

            <form id="uploadImage" method="post" enctype="multipart/form-data" style="text-align: center; margin-bottom: 3rem;">
                <input type="file" name="image" id="image-input" accept="image/*" required>
                <div style="margin: 1rem 0;">
                    <button type="submit" class="submit-btn">Run Segmentation</button>
                </div>
            </form>

            <div class="info-grid" style="grid-template-columns: 1fr 1fr; align-items: start;">
                <div style="text-align: center;">
                    <h3 style="margin-bottom: 1rem; color: var(--text-muted);">Input Image</h3>
                    <div class="image-preview-wrapper" style="width: 100%; height: 350px;">
                        <img id="image-preview" alt="Preview">
                        <div id="preview-placeholder">Select MRI Image</div>
                    </div>
                </div>
                <div style="text-align: center;">
                    <h3 style="margin-bottom: 1rem; color: var(--primary);">Segmented Result</h3>
                    <div class="image-preview-wrapper" style="width: 100%; height: 350px; background: #000;">
                        <img id="result-image" alt="Result" style="display: none;">
                        <div id="result-placeholder" style="color: #475569;">Analysis Pending</div>
                    </div>
                </div>
            </div>

            <div id="stats" class="card" style="margin-top: 2rem; display: none; background: rgba(255,255,255,0.9);">
                <div style="display: flex; justify-content: space-around; align-items: center; text-align: center;">
                    <div>
                        <p style="color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; font-weight: 600;">Tumor Area</p>
                        <p id="displayPercent" style="font-size: 2rem; font-weight: 800; color: var(--primary);"></p>
                    </div>
                    <div>
                        <p style="color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; font-weight: 600;">Clinical Grade</p>
                        <p id="grade" style="font-size: 2rem; font-weight: 800; color: #ef4444;"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        $(function () {
            const $preview = $('#image-preview');
            const $placeholder = $('#preview-placeholder');
            const $resImg = $('#result-image');
            const $resPlaceholder = $('#result-placeholder');
            const $stats = $('#stats');

            $('#image-input').on('change', function(e) {
                $stats.hide();
                $resImg.hide();
                $resPlaceholder.show();
                
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        $preview.attr('src', e.target.result).show();
                        $placeholder.hide();
                    }
                    reader.readAsDataURL(file);
                }
            });

            $('#uploadImage').on('submit', function (e) {
                e.preventDefault();
                const formData = new FormData(this);
                
                $resPlaceholder.text("Segmenting...");
                
                $.ajax({
                    type: 'POST',
                    url: '/segment.html',
                    data: formData,
                    cache: false,
                    contentType: false,
                    processData: false,
                    success: function (data) {
                        $resImg.attr('src', "data:image/jpg;base64," + data.img_base64).show();
                        $resPlaceholder.hide();
                        
                        // Original logic had: tumorPercent = parseInt(100 - tumorPercent);
                        const tumorPercent = (100 - parseFloat(data.tumor_percentage)).toFixed(2);
                        $('#displayPercent').text(tumorPercent + "%");
                        
                        const $grade = $('#grade');
                        $grade.text(data.severity + " Grade " + data.tumor_type).css('color', data.severity === 'High' ? '#ef4444' : '#f59e0b');
                        
                        $stats.fadeIn();
                    },
                    error: function() {
                        $resPlaceholder.text("Segmentation failed.");
                    }
                });
            });
        });
    </script>
</body>
</html>
